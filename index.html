<!DOCTYPE html>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #050505;
  --panel: #0c0c0c;
  --line: #252525;
  --text: #ffffff;
  --muted: #888888;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 50% 0%, #181818 0%, #050505 45%, #000000 100%);
  color: var(--text);
  min-height: 100vh;
}

/* Background grid */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.12;

  background-image:
    linear-gradient(#fff 1px, transparent 1px),

  background-size: 40px 40px;

  mask-image: linear-gradient(

    black,

}

.container {
  width: min(1120px, 92%);
  margin: auto;
}

nav {

  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid #222;

  position: relative;
  z-index: 2;
}

.logo {

.navtag {

  font-size: 10px;

}

h1 {

  letter-spacing: -4px;

  margin: 24px 0 18px;

  text-shadow:

}

.hero p {
  color: #aaa;

  max-width: 600px;

  margin: auto;

  line-height: 1.6;
}

.controls {
  display: flex;

  margin: 0 auto 34px;

  max-width: 760px;
}

input {
  width: 100%;

  background: #0b0b0b;

  border: 1px solid #292929;

  color: #fff;

  padding: 15px 17px;

  border-radius: 10px;

  outline: none;
}

input::placeholder {
  color: #666;
}

input:focus {
  border-color: #777;

  box-shadow:
    0 0 20px rgba(255,255,255,.12);
}

.count {
  min-width: 120px;

  border: 1px solid #292929;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #aaa;

  font-size: 12px;

  background: #0b0b0b;
}

/* PACK GRID */

.grid {
  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 16px;

  padding-bottom: 70px;
}

/* CARD */

.card {
  position: relative;

  background:

  border: 1px solid #262626;

  border-radius: 16px;

  padding: 22px;

  min-height: 175px;

  transition: .25s;

  overflow: hidden;
}

.card:hover {
  transform: translateY(-4px);

  border-color: #666;

  box-shadow:

}

.name {

  margin-bottom: 8px;
}
