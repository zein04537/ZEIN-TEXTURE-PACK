<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZEIN TEXTURE PACKS</title>

<meta name="description" content="ZEIN TEXTURE PACKS — Minecraft texture packs by Zein.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --panel:#0c0c0c;
    --line:#242424;
    --text:#fff;
    --muted:#999;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 50% 0%,
            #181818 0%,
            #050505 45%,
            #000 100%
        );
    color:var(--text);
    min-height:100vh;
}

/* Background grid */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.12;

    background-image:
        linear-gradient(#fff 1px,transparent 1px),
        linear-gradient(90deg,#fff 1px,transparent 1px);

    background-size:40px 40px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 65%
        );
}

/* Main container */

.container{
    width:min(1120px,92%);
    margin:auto;
}

/* Navigation */

nav{
    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #222;

    position:relative;
    z-index:2;
}

.logo{
    font-weight:900;
    letter-spacing:2px;
    font-size:18px;

    text-shadow:
        0 0 12px #fff,
        0 0 28px #fff;
}

.navtag{
    font-size:11px;
    color:#888;
    letter-spacing:2px;
}

/* Hero */

.hero{
    text-align:center;
    padding:92px 0 62px;
    position:relative;
}

.badge{
    display:inline-block;

    border:1px solid #333;
    border-radius:999px;

    padding:8px 14px;

    font-size:10px;
    letter-spacing:3px;

    color:#aaa;
    background:#090909;

    box-shadow:
        0 0 18px rgba(255,255,255,.06);
}

/* Main title */

h1{
    font-size:clamp(42px,9vw,92px);

    font-weight:1000;

    line-height:.9;

    letter-spacing:-4px;

    margin:24px 0 18px;

    text-shadow:
        0 0 8px #fff,
        0 0 24px rgba(255,255,255,.65),
        0 0 55px rgba(255,255,255,.3);
}

.hero p{
    color:#aaa;

    max-width:600px;

    margin:auto;

    line-height:1.6;
}

/* Search */

.controls{
    display:flex;

    gap:12px;

    margin:0 auto 34px;

    max-width:760px;
}

input{
    width:100%;

    background:#0b0b0b;

    border:1px solid #292929;

    color:#fff;

    padding:15px 17px;

    border-radius:10px;

    outline:none;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.02);
}

input::placeholder{
    color:#666;
}

input:focus{
    border-color:#777;

    box-shadow:
        0 0 20px rgba(255,255,255,.12);
}

/* Pack counter */

.count{
    min-width:120px;

    border:1px solid #292929;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#aaa;

    font-size:12px;

    background:#0b0b0b;
}

/* Pack grid */

.grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

    padding-bottom:70px;
}

/* Pack card */

.card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #111,
            #080808
        );

    border:1px solid #262626;

    border-radius:16px;

    padding:22px;

    min-height:175px;

    transition:.25s;

    overflow:hidden;
}

/* Glow inside card */

.card:after{
    content:"";

    position:absolute;

    top:-80px;
    right:-80px;

    width:160px;
    height:160px;

    border-radius:50%;

    background:#fff;

    opacity:.025;

    filter:blur(30px);
}

/* Card hover */

.card:hover{
    transform:translateY(-4px);

    border-color:#666;

    box-shadow:
        0 0 30px rgba(255,255,255,.1);
}

/* Pack number */

.num{
    font-size:10px;

    color:#666;

    letter-spacing:2px;

    margin-bottom:18px;
}

/* Pack name */

.name{
    font-size:18px;

    font-weight:800;

    margin-bottom:8px;
}

/* File type */

.file{
    font-size:10px;

    color:#666;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:20px;
}

/* Download button */

.download{
    display:inline-flex;

    text-decoration:none;

    color:#000;

    background:#fff;

    border-radius:8px;

    padding:11px 16px;

    font-size:11px;

    font-weight:900;

    letter-spacing:1px;

    transition:.2s;
}

.download:hover{
    background:#eee;

    box-shadow:
        0 0 20px rgba(255,255,255,.7);

    transform:scale(1.03);
}

/* Footer */

footer{
    border-top:1px solid #202020;

    text-align:center;

    padding:28px;

    color:#666;

    font-size:10px;

    letter-spacing:2px;
}

/* No results */

.empty{
    text-align:center;

    color:#777;

    padding:50px;

    display:none;

    grid-column:1/-1;
}

/* Mobile */

@media(max-width:700px){

    nav{
        height:64px;
    }

    .navtag{
        display:none;
    }

    .hero{
        padding:70px 0 45px;
    }

    h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .controls{
        flex-direction:column;
    }

    .count{
        height:45px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- NAVIGATION -->

<nav>

    <div class="logo">
        ZEIN
    </div>

    <div class="navtag">
        MINECRAFT • TEXTURE PACKS
    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <span class="badge">
        MINECRAFT RESOURCE HUB
    </span>

    <h1>
        ZEIN TEXTURE<br>
        PACKS
    </h1>

    <p>
        My collection of Minecraft texture packs.
        Find your pack, hit download, and you're ready to play.
    </p>

</section>


<!-- SEARCH + COUNTER -->

<div class="controls">

    <input
        id="search"
        type="search"
        placeholder="Search texture packs..."
    >

    <div class="count">
        <span id="count">16</span>
        &nbsp; PACKS
    </div>

</div>


<!-- PACK LIST -->

<main id="grid" class="grid"></main>


<!-- EMPTY SEARCH RESULT -->

<div id="empty" class="empty">
    No texture pack found.
</div>

</div>


<!-- FOOTER -->

<footer>
    © 2026 ZEIN TEXTURE PACKS • ALL RIGHTS RESERVED
</footer>


<script>

/* =========================================
   TEXTURE PACK DATA
========================================= */

const packs = [

    [
        "Better Grass + Sky",
        "https://www.mediafire.com/file/kr5rwb6zdo4fthj/Better_Grass__Sky_by_Zein.mcpack/file"
    ],

    [
        "Better Inventory v1.1.19",
        "https://www.mediafire.com/file/f954k5btz56nmj7/Better_Inventory_v1.1.19_by_Zein.mcpack/file"
    ],

    [
        "Better Sounds v3",
        "https://www.mediafire.com/file/94grlp3ia0e4mcr/Better_Sounds.v3_by_Zein.ID.mcpack/file"
    ],

    [
        "Fast-CraftFast-V3.5-Loot",
        "https://www.mediafire.com/file/tt68f20g9dtoj0f/Fast-CraftFast-V3.5-Loot_by_Zein.mcpack/file"
    ],

    [
        "Glowing Ores",
        "https://www.mediafire.com/file/q3550tth4usbotb/Glowing-Ores_by_Zein.ID.mcpack/file"
    ],

    [
        "Glowing Arm",
        "https://www.mediafire.com/file/8rqqbq8wiv9kf7v/GlowingArm_by_Zein.mcpack/file"
    ],

    [
        "Hover Text Fix",
        "https://www.mediafire.com/file/t0ilmwa74f8cssw/hover_text_fix_by_Zein.mcpack/file"
    ],

    [
        "JustAnimation V1.2",
        "https://www.mediafire.com/file/bw66h902qr9hu6v/JustAnimation_V1.2_by_Zein.mcpack/file"
    ],

    [
        "Low Fire",
        "https://www.mediafire.com/file/joq7cjmppntmnx1/lowfire_1600906944_by_Zein.mcpack/file"
    ],

    [
        "No Lava/Water Fog v1.2.12",
        "https://www.mediafire.com/file/yhkcldo42k6p8qq/No_LavaWater_Fog_v1.2.12_by_Zein.mcpack/file"
    ],

    [
        "Orion Armor V1",
        "https://www.mediafire.com/file/aneq1r6n2hdf7le/Orion-Armor-V1_by_Zein.mcpack/file"
    ],

    [
        "Render Distance Limiter V1.1",
        "https://www.mediafire.com/file/to4z9o0gdu7uycs/Render_Distance_Limiter_V1.1_by_Zein.mcpack/file"
    ],

    [
        "RGB Outline",
        "https://www.mediafire.com/file/iy5hd8s2f8bhbtj/Rgb_Outline_by_Zein.mcpack/file"
    ],

    [
        "Sodium GL 2.1",
        "https://www.mediafire.com/file/4uo1moa96vc7och/Sodium-GL-2.1_by_Zein.mcpack/file"
    ],

    [
        "Toggle Night Vision v0.7.1",
        "https://www.mediafire.com/file/25w28033qdmeya2/Toggle_Night_Vision_v0.7_1_by_Zein.mcpack/file"
    ],

    [
        "ViewModel V1.4.2",
        "https://www.mediafire.com/file/gq75uk25qkvln97/ViewModel_V1.4.2_by_Zein.mcpack/file"
    ]

];


/* =========================================
   GET HTML ELEMENTS
========================================= */

const grid = document.getElementById("grid");

const search = document.getElementById("search");

const count = document.getElementById("count");

const empty = document.getElementById("empty");


/* =========================================
   RENDER PACKS
========================================= */

function render(list){

    grid.innerHTML = "";

    list.forEach((pack, index) => {

        const card = document.createElement("article");

        card.className = "card";

        card.innerHTML = `
            <div class="num">
                PACK ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="name">
                ${pack[0]}
            </div>

            <div class="file">
                .MCPACK • MEDIAFIRE
            </div>

            <a
                class="download"
                href="${pack[1]}"
                target="_blank"
                rel="noopener noreferrer"
            >
                DOWNLOAD ↗
            </a>
        `;

        grid.appendChild(card);

    });


    /* Update pack counter */

    count.textContent = list.length;


    /* Show/hide empty message */

    if(list.length === 0){

        empty.style.display = "block";

    }else{

        empty.style.display = "none";

    }

}


/* =========================================
   SEARCH
========================================= */

search.addEventListener("input", function(){

    const query = search.value
        .trim()
        .toLowerCase();


    const filteredPacks = packs.filter(function(pack){

        return pack[0]
            .toLowerCase()
            .includes(query);

    });


    render(filteredPacks);

});


/* =========================================
   INITIAL LOAD
========================================= */

render(packs);

</script>

</body>
</html>
